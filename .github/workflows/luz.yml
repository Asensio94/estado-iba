name: Luz nocturna

on:
  schedule:
    - cron: "40 3 2 * *"  # monthly: NASA publishes each year in spring and sometimes reprocesses; an idle month only asks the catalogue
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diario  # same group as the daily build, so the two never push at once
  cancel-in-progress: false

jobs:
  luz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Night light per site
        timeout-minutes: 100  # the first run downloads every year since 2012 (~8 GB); later ones, a year at most
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python -m estado.cli luz
      - name: Rebuild the panel if the light changed
        run: |
          if [ -n "$(git status --porcelain docs/datos/luz.json)" ]; then python -m estado.cli build; fi
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Luz nocturna del $(date -u +%F)"
          git pull --rebase
          git push
