name: Diario

on:
  schedule:
    - cron: "15 8 * * *"  # after the daily siblings (grafo 07:40); cartera publishes at 10:30 and changes slowly, so yesterday's is fine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m estado.cli build  # Spain into docs/, France into docs/fr/
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Panel del $(date -u +%F)"
          git push
